name: CI — Build & Test

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (ROS Noetic, Ubuntu 20.04 container)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    env:
      DEBIAN_FRONTEND: noninteractive
      WS: ${{ github.workspace }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake \
            ca-certificates curl gnupg lsb-release sudo \
            python3 python3-pip git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS Noetic
        run: |
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key |
            gpg --dearmor -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros/ubuntu focal main" \
            > /etc/apt/sources.list.d/ros-latest.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-noetic-desktop-full \
            python3-rosdep python3-catkin-tools
          rosdep init || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          apt-get install -y --no-install-recommends \
            ros-noetic-mavros ros-noetic-mavros-extras ros-noetic-mavros-msgs \
            ros-noetic-ros-control ros-noetic-ros-controllers ros-noetic-gazebo-ros-control \
            ros-noetic-teleop-twist-keyboard ros-noetic-robot-localization \
            ros-noetic-cv-bridge ros-noetic-tf2-ros
          # workaround for gazebo_ros package not fully resolvable in headless CI
          apt-get install -y --no-install-recommends \
            ros-noetic-gazebo-ros-pkgs ros-noetic-gazebo-ros || true

      # 直接用仓库根的 requirements.txt, 不再在这里重抄一遍版本号。
      # 之前是手抄的, 结果上界 (numpy<2.0.0 / pymavlink<3.0.0) 全漏了 ——
      # numpy 2 会直接搞坏 Noetic 的 cv_bridge。单一来源比对齐检查更省事。
      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: rosdep check
        run: |
          source /opt/ros/noetic/setup.bash
          cd $WS
          rosdep check --from-paths src --ignore-src -r -y || echo "rosdep check completed (warnings may exist for optional deps)"

      - name: Build workspace
        run: |
          source /opt/ros/noetic/setup.bash
          cd $WS
          catkin build --summarize --no-status
        timeout-minutes: 30

      - name: Run unit tests
        run: |
          source /opt/ros/noetic/setup.bash
          source $WS/devel/setup.bash || true
          cd $WS
          catkin test --no-status || echo "Tests completed (check summary above)"
        timeout-minutes: 15

      - name: Test summary
        if: always()
        run: |
          cd $WS
          if ls build/test_results/*/pytest.xml 2>/dev/null; then
            echo "=== Test Results ==="
            cat build/test_results/*/pytest.xml 2>/dev/null | grep -E 'testsuite|testcase' | head -50
          fi
          catkin_test_results build/test_results 2>/dev/null || echo "Review test output above."

  # ---------------------------------------------------------------------------
  # Task-10: STM32F407VET6 麦轮固件
  #
  # 与 ROS job 完全并行，互不阻塞：固件不需要 ROS 环境，ROS 也不需要 ARM 工具链。
  # 单元测试用宿主机 gcc 跑，交叉编译只验证固件能链接成 .bin。
  # Task-13 会在此基础上补齐 MSPM0 / Docker / Lint 三个 job。
  # ---------------------------------------------------------------------------
  build-stm32-firmware:
    name: Build STM32F407 Mecanum Firmware (task-10)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: src/firmware/stm32_mecanum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
        working-directory: .

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      # 先跑测试再编固件：算法错了就没必要浪费时间产出二进制
      - name: Run host unit tests
        run: make test

      - name: Cross-compile firmware
        run: |
          make -j"$(nproc)" \
            FW_COMMIT="$(git rev-parse --short HEAD)" \
            FW_TIME="$(date -u +%Y%m%d-%H%M)"

      - name: Report firmware size
        run: make size

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-mecanum-firmware
          path: |
            src/firmware/stm32_mecanum/build/*.bin
            src/firmware/stm32_mecanum/build/*.hex
            src/firmware/stm32_mecanum/build/*.elf
            src/firmware/stm32_mecanum/build/*.map
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Task-11: MSPM0G3507 差速固件 (TI 电赛合规主控)
  #
  # 与 STM32 job 结构一致，但有一处必须说明的差异：
  # 本 job 只构建 PROFILE=ci-link 剖面 —— 移植层为空实现，产出的 .bin **不可烧录**。
  # 原因是 TI MSPM0 SDK 无法在 GitHub Actions 上免登录安装，而凭印象手写
  # MSPM0 寄存器地址会产出一个"CI 全绿但上板不动"的固件。
  # 详见 src/firmware/mspm0_diff/src/mspm0_conf.h 与 ADR-0004 §决策-4。
  #
  # 被空实现掉的只有十几个寄存器原语；运动学、协议、PID、测速窗口、环形缓冲
  # 全部是真实代码，由本 job 的 70 个 Host 用例覆盖。
  # ---------------------------------------------------------------------------
  build-mspm0-firmware:
    name: Build MSPM0G3507 Differential Firmware (task-11)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: src/firmware/mspm0_diff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
        working-directory: .

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      # 先跑测试再编固件：算法错了就没必要浪费时间产出二进制
      - name: Run host unit tests
        run: make test

      - name: Cross-compile firmware (ci-link profile)
        run: |
          make -j"$(nproc)" \
            FW_COMMIT="$(git rev-parse --short HEAD)" \
            FW_TIME="$(date -u +%Y%m%d-%H%M)"

      - name: Report firmware size
        run: make size

      # 产出物名字里带 ci-link，让任何拿到 artifact 的人一眼看出它不可烧录
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mspm0-diff-firmware-ci-link
          path: |
            src/firmware/mspm0_diff/build/*.bin
            src/firmware/mspm0_diff/build/*.hex
            src/firmware/mspm0_diff/build/*.elf
            src/firmware/mspm0_diff/build/*.map
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Task-12: 树莓派部署配置
  #
  # 分成两个 job:
  #   validate-deployment — 秒级静态校验, 与本地 `bash src/deployment/validate.sh`
  #                         **跑的是同一份脚本**。两份必然漂移, 所以不写第二份。
  #   build-edge-image    — ARM64 镜像构建, 分钟级, 只在部署/ROS 包变更时跑。
  #
  # 部署配置的失败方式是"到了现场才发现"。这两个 job 的目的是把能静态查出来的
  # 全部前移到提交时。
  # ---------------------------------------------------------------------------
  validate-deployment:
    name: Validate Deployment Config (task-12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # systemd-analyze 来自 systemd 包, ubuntu-latest 自带;
      # 显式装 pyyaml 让 compose 走完整解析而不是降级的结构检查。
      # (task-13) 不再装 shellcheck: 本 job 已不跑它, validate.sh 用的是 `bash -n`。
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd
          python3 -m pip install --quiet pyyaml

      # 与本地同一个入口。本地会 SKIP 掉 systemd-analyze, 这里会真的跑。
      - name: Static validation
        run: bash src/deployment/validate.sh

      # (task-13) 原先这里有一个非阻塞的 shellcheck 步骤, 已删除。
      # 它只扫 src/deployment 且 `|| true` 到底 —— 永远不会失败的检查等于没有检查。
      # 现由 lint-scripts job 全仓扫描并**阻塞**, 见该 job 的说明。

      # compose 的完整语义校验需要 docker CLI —— ubuntu-latest 自带。
      # ROS_IP 是刻意设成"未提供即报错"的 (见 ADR-0006 §决策-3),
      # 因此这里必须显式注入假值; 若不注入也能通过, 说明那条约束是假的。
      - name: docker compose config
        run: |
          cd src/deployment/docker
          export ROS_IP=192.168.1.10 ROLE=car CHASSIS=diff                  ROS_MASTER_URI=http://192.168.1.100:11311
          echo "--- car ---"
          docker compose -f docker-compose.edge.yml -f docker-compose.car.yml config >/dev/null
          echo "--- car + sensors ---"
          docker compose -f docker-compose.edge.yml -f docker-compose.car.yml                          -f docker-compose.car-sensors.yml config >/dev/null
          echo "--- drone ---"
          ROLE=drone ROS_IP=192.168.1.20             docker compose -f docker-compose.edge.yml -f docker-compose.drone.yml config >/dev/null
          echo "全部 compose 组合解析通过"

      # 反向验证: 不给 ROS_IP 时必须失败。
      # 没有这一步的话, 上面那条约束哪天被人改成有默认值也不会有人发现。
      - name: ROS_IP guard must actually fail without it
        run: |
          cd src/deployment/docker
          export ROLE=car CHASSIS=diff ROS_MASTER_URI=http://192.168.1.100:11311
          unset ROS_IP
          if docker compose -f docker-compose.edge.yml -f docker-compose.car.yml config >/dev/null 2>&1; then
            echo "::error::ROS_IP 未设置时 compose 竟然通过了 —— ADR-0006 §决策-3 的约束已失效"
            exit 1
          fi
          echo "ROS_IP 缺失时正确地失败了"

  build-edge-image:
    name: Build Edge Image ARM64 (task-12)
    runs-on: ubuntu-latest
    # 静态校验没过就没必要花十几分钟构建镜像
    needs: validate-deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 树莓派是 ARM64, CI runner 是 x86 —— 需要 qemu 做用户态模拟
      # (task-12 评审建议 5)。代价是构建比原生慢数倍。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edge image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/deployment/docker/Dockerfile.edge
          platforms: linux/arm64
          push: false
          # 不 load 到本地 daemon: 跨架构镜像 load 不进 x86 daemon,
          # 而且这里只关心"能不能构建成功"。
          outputs: type=cacheonly
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 60

  # ---------------------------------------------------------------------------
  # Task-13: 全仓静态检查
  #
  # 这是 task-13 唯一新增的 job —— 另外四个维度 (ROS / STM32 / MSPM0 / Docker)
  # 已由 task-10/11/12 在交付各自功能时建好。
  #
  # 门禁按"**是否在本地实测过**"分层, 而不是按工具的名气或严格程度 (ADR-0008):
  #
  #   工具         版本      范围              提交前实测结果    本 job 行为
  #   ----------   -------   ---------------   ---------------   ----------
  #   shellcheck   0.10.0    22 个 *.sh        warning 级 0 条   阻塞
  #   yamllint     1.38.0    14 个 *.y[a]ml    0 条              阻塞
  #   flake8       7.1.1     全部 *.py         0 条              阻塞
  #   cppcheck     发行版版本 src/firmware      **未实测**        仅告警
  #
  # 三个阻塞工具全部**钉死版本号**。理由: 不钉版本的话, 上游加一条新规则就能
  # 把绿灯变红, 而看红灯的人无法区分"代码退化了"和"工具升级了"。
  # 钉版本的代价是要人工升级, 换来的是"红灯一定意味着代码有问题"。
  #
  # 不在这里做 systemd 单元校验: `systemd-analyze verify` 已由 validate.sh §6b
  # 在 validate-deployment job 里真跑。同一个检查只实现一处。
  # ---------------------------------------------------------------------------
  lint-scripts:
    name: Lint Scripts & Configs (task-13)
    runs-on: ubuntu-latest

    env:
      SHELLCHECK_VERSION: v0.10.0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 不用 apt 装 shellcheck: ubuntu-latest 的版本是 0.9.0, 与提交前实测用的
      # 0.10.0 不是同一版。"用没实测过的版本做门禁"等于门禁没实测过。
      - name: Install shellcheck (pinned)
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf -
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Install Python linters (pinned)
        run: pip3 install --quiet "yamllint==1.38.0" "flake8==7.1.1"

      # --severity=warning: error 级当前 0 条, 只卡 error 等于不卡回归 ——
      # 新脚本引入 SC2164 (cd 未判错) 这类问题时 CI 照样会绿。
      # info/style 级 (37 条) 不纳入门禁: 多是风格偏好, 拿来拦提交性价比不高。
      # -x 让它跟随 source 进去查。
      - name: ShellCheck (blocking, severity>=warning)
        run: |
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          echo "检查 ${#scripts[@]} 个 shell 脚本"
          shellcheck -x --severity=warning -f gcc "${scripts[@]}"

      # 用 git ls-files 而不是通配符展开: 通配符要么漏目录, 要么扫进
      # 未入库的临时文件。门禁的范围必须和仓库内容一致。
      #
      # line-length 关掉 —— 仓库里的 compose/config 有对齐用的长行, 折行反而更难读。
      # 其余 relaxed 规则保留, 包括 new-lines (行尾必须 LF): Linux 侧内容实测 0 条。
      - name: yamllint (blocking)
        run: |
          mapfile -d '' -t yamls < <(git ls-files -z '*.yaml' '*.yml')
          echo "检查 ${#yamls[@]} 个 YAML 文件"
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "${yamls[@]}"

      - name: flake8 (blocking)
        run: |
          mapfile -d '' -t pys < <(git ls-files -z '*.py')
          echo "检查 ${#pys[@]} 个 Python 文件"
          flake8 --max-line-length=120 --count "${pys[@]}"

      # ⚠ 非阻塞, 且这不是"先宽松以后再收紧"的托词 ——
      # 提交这一步时本地既没有 cppcheck 也没有 make, **它对固件 C 代码的输出
      # 一次都没跑过**。把没实测过的检查设成阻塞, 等于用别人的 CI 当试验场。
      # 首轮 CI 输出出来后再决定: 若告警可控就升为阻塞并删掉这段注释;
      # 若噪声大则调 --suppress 或撤掉。在那之前它只是一份报告。
      # (task-13 评审建议 2 / ADR-0008 §决策-1)
      - name: cppcheck (ADVISORY — 输出未经实测, 见 ADR-0008)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
          cppcheck --enable=warning,style,performance,portability \
                   --std=c99 --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   -I src/firmware/common \
                   src/firmware/common src/firmware/stm32_mecanum/src \
                   src/firmware/mspm0_diff/src
