# Phase 1.5 共享车载载荷参数 —— 三个传感器驱动和底盘串口桥共用一份。
#
# 与仿真侧 config/car_sensors.yaml 的关系:
#   car_sensors.yaml   描述 Gazebo 里那套虚拟传感器 (给 URDF 和标定用)
#   real_sensors.yaml  描述实物传感器的接线与量程 (给驱动骨架用)
# 两边的**话题名与消息类型必须一致**, 否则 car_preprocessor.py 在实机上
# 订不到任何东西, 而且不会有任何报错。test/test_topic_contract.py 守这条。
#
# backend: real — 默认真硬件；未实现的访问层必须启动失败 (ADR-0009/0015)
#          mock — 仅显式冒烟使用，entrypoint 会将整机标记为降级
backend: real

# --- 思岚 RPLIDAR A2M12 (UART 256000，SLAMTEC 官方规格) ---
rplidar:
  model: A2M12
  # udev 稳定名；不要写会随枚举顺序漂移的 ttyUSB0。
  port: /dev/rplidar
  baudrate: 256000
  topic: /car/scan
  # frame_id 与 urdf/car_sensors.urdf.xacro 里的 link 名一致
  frame_id: lidar_link
  samples: 360
  scan_rate: 10.0
  min_range: 0.15
  max_range: 12.0
  # 扫描张角。ROS 规定逆时针为正 (REP-103), 雷达自身是顺时针,
  # 驱动里做了取负; 少这个负号地图会前后镜像。
  angle_min: -3.14159265
  angle_max: 3.14159265
  # 一次 read() 取多少字节。512 ≈ 100 个采样点, 10Hz/360 点时约 1/4 圈。
  read_chunk: 512
  # 断线重连间隔 (s) 与"多久收不到字节算掉线"(s)
  reconnect_interval: 2.0
  data_timeout: 2.0

# --- TDK ICM42688-P 6 轴 IMU (I2C 0x68) ---
icm42688:
  bus: 1
  address: 0x68
  # 与仿真侧 libgazebo_ros_imu_sensor.so 的 topicName 对齐 (imu/data)
  topic: /car/imu/data
  frame_id: imu_link
  update_rate: 100.0
  # 量程。驱动按这两个值写 ACCEL_CONFIG0 / GYRO_CONFIG0 并推导灵敏度,
  # 不要在代码里改常量。可选值: g = 2/4/8/16, dps = 125/250/500/1000/2000
  accel_range_g: 4
  gyro_range_dps: 500
  # 协方差用的噪声标准差。当前沿用 car_sensors.yaml 的仿真值,
  # 实机静置标定后由 task-15 替换。
  gyro_noise_stddev: 0.0005
  accel_noise_stddev: 0.001
  reconnect_interval: 2.0

# --- 可插拔底盘 MCU 桥（STM32 麦轮 / MSPM0 差速） ---
# HC-SR04 属于底盘控制模块。MCU 负责微秒级触发/捕获，Pi 只解码统一的
# CMD_ULTRASONIC 帧；这使同一套共享载荷无需改 GPIO 接线即可换底盘。
chassis_bridge:
  port: /dev/mcu
  baudrate: 115200
  command_topic: /car/cmd_vel
  topic_prefix: /car/ultrasonic
  frame_id_template: ultrasonic_{name}_link
  directions: [front, rear, left, right]
  min_range: 0.02
  max_range: 4.0
  read_chunk: 256
  poll_rate: 100.0
  handshake_timeout: 2.0
  ultrasonic_startup_timeout: 2.0
  data_timeout: 1.0
  reconnect_interval: 2.0

# --- OpenMV 云台相机 (UART) ---
openmv:
  # OpenMV USB CDC 的 udev 稳定名，与 compose 设备映射一致。
  port: /dev/openmv
  baudrate: 115200
  topic: /car/openmv/detections
  read_chunk: 256
  # 单行上限。超过还没等到 '\n' 就丢缓冲, 防止对端乱发时把内存吃光。
  max_line_bytes: 4096
  reconnect_interval: 2.0
  data_timeout: 5.0
