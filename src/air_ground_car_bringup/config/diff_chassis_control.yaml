# ros_control configuration for the Task-03 differential chassis.
car:
  # Convert velocity error to bounded joint effort. This approximates the
  # closed-loop 520 motor drive instead of using Gazebo's ideal SetVelocity.
  gazebo_ros_control:
    pid_gains:
      left_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}
      right_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 30

  gimbal_pan_controller:
    type: position_controllers/JointPositionController
    joint: gimbal_pan_joint

  gimbal_tilt_controller:
    type: position_controllers/JointPositionController
    joint: gimbal_tilt_joint

  diff_drive_controller:
    type: diff_drive_controller/DiffDriveController
    left_wheel: [left_wheel_joint]
    right_wheel: [right_wheel_joint]
    publish_rate: 30
    wheel_separation: 0.18
    wheel_radius: 0.033
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 10
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    open_loop: false
    publish_cmd: true
    pose_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 5.0
