# ros_control configuration for the Task-04 mecanum chassis.
car:
  # Each wheel needs enough effort to overcome the anisotropic roller contact.
  # The proportional gain remains bounded by the URDF joint effort limit.
  gazebo_ros_control:
    pid_gains:
      front_left_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}
      front_right_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}
      rear_left_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}
      rear_right_wheel_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0}

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 30

  front_left_wheel_controller:
    type: velocity_controllers/JointVelocityController
    joint: front_left_wheel_joint

  front_right_wheel_controller:
    type: velocity_controllers/JointVelocityController
    joint: front_right_wheel_joint

  rear_left_wheel_controller:
    type: velocity_controllers/JointVelocityController
    joint: rear_left_wheel_joint

  rear_right_wheel_controller:
    type: velocity_controllers/JointVelocityController
    joint: rear_right_wheel_joint
