# 仿真与 D435i 共用的项目侧处理参数。source_topics 仅是 SITL 默认值；
# drone-edge-real.launch 会把输入显式改到 RealSense ROS 话题。
# These top-level keys are consumed directly by pcl/VoxelGrid.
leaf_size: 0.05
filter_field_name: z
filter_limit_min: 0.2
filter_limit_max: 8.0

depth_camera:
  # 与 drone-vision-d435i.launch 的 Pi 5 保守实机 profile 保持一致。
  resolution: [640, 480]
  update_rate: 15.0
  horizontal_fov_deg: 86.0
  min_range: 0.1
  max_range: 8.0
  frame_id: camera_link
  real_mode: d435i
  source_topics:
    rgb: /iris/camera/rgb/image_raw
    depth: /iris/camera/depth/image_raw
    points: /iris/camera/depth/points
  project_topics:
    rgb: /drone/camera/rgb/image_raw
    depth: /drone/camera/depth/image_raw
    points: /drone/camera/depth/points_downsampled

gps:
  update_rate: 5.0
  home_lat: 47.397742
  home_lon: 8.545594
  home_alt: 488.0
  source_topic: /mavros/global_position/global
  local_pose_topic: /drone/gps/local_pose
  local_frame_id: map
  # 上述 HOME 仅供 SITL 的 NavSatFix→ENU 转换。drone-edge-real.launch 直接转发
  # Pixhawk EKF 的 /mavros/local_position/pose，禁止把仿真经纬度带到真实飞行。

imu:
  source_topic: /mavros/imu/data

mavlink:
  mavros_bind_port: 14540
  px4_remote_port: 14557
