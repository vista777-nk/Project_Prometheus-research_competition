# =============================================================================
# sshd_hardening.conf — sshd 加固配置片段
#
# 安装:
#   sudo install -m 0644 sshd_hardening.conf /etc/ssh/sshd_config.d/10-air-ground.conf
#   sudo sshd -t                       # ← 先验证语法, 这一步不能跳
#   sudo systemctl reload ssh
#
# ⚠ **改 sshd 配置前一定要另开一个 SSH 会话不要关**。配置写错时 reload 会让
#   sshd 拒绝新连接, 已有会话是唯一的补救通道; 否则只能拔卡插读卡器改文件。
#
# -----------------------------------------------------------------------------
# 与 task-12 §12.6 原文的一处关键差异
# -----------------------------------------------------------------------------
# 原文写 `ChallengeResponseAuthentication no`。这个选项在 **OpenSSH 8.7 起被
# 改名**为 KbdInteractiveAuthentication, 并在 **9.x 中彻底移除**。
# 树莓派 OS Bookworm 带的是 OpenSSH 9.2 —— 配置里留着这一行会让
# `sshd -t` 直接报 "Bad configuration option", sshd 起不来。
# 也就是说照抄原文会把自己锁在门外, 而且这台 Pi 可能已经装在无人机上了。
#
# 这里同时写两个选项名不可行 (旧名在 9.x 上就是非法的), 因此只写新名。
# 若目标系统是 OpenSSH < 8.7 (如 Ubuntu 20.04 的 8.2), 把下面那行换成旧名。
# 用 `ssh -V` 确认版本。
# =============================================================================

# --- 认证 --------------------------------------------------------------------
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# 只允许项目用户登录。加了新用户记得同步这里, 否则新用户登不上。
AllowUsers airground

# --- 会话限制 ----------------------------------------------------------------
MaxAuthTries 3
MaxSessions 3

# 300 秒无响应即断开 (ClientAliveCountMax 0 = 一次探测无应答就断)。
#
# 权衡: 这个设置对"挂在那里不动的调试终端"很不友好 —— 泡杯咖啡回来就掉线了。
# 但边缘节点常年在线且暴露在场地 WiFi 上, 悬挂会话是实实在在的风险面。
# 需要长时间跟踪日志请用 `journalctl -f` 配合 tmux, 或临时调大这个值。
ClientAliveInterval 300
ClientAliveCountMax 0

# --- 关掉用不到的功能 ---------------------------------------------------------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# --- 其他 --------------------------------------------------------------------
# 登录横幅里不要写版本号/主机用途, 那是免费送给扫描器的信息
PrintLastLog yes
LogLevel VERBOSE
