# =============================================================================
# chrony-client.conf — 向车机同步时间 (无人机 Pi 与实验室服务器共用)
#
# 安装 (**无人机 192.168.1.20 / 服务器 192.168.1.100**):
#   sudo install -m 0644 chrony-client.conf /etc/chrony/conf.d/air-ground.conf
#   sudo systemctl restart chrony
# 验证:
#   chronyc sources -v        # 车机那一行前面应该出现 ^*
#   chronyc tracking | grep 'System time'
#
# 主从关系与理由见 chrony-car-server.conf 文件头。
# =============================================================================

# --- 主时间源: 车机树莓派 ------------------------------------------------------
# prefer: 即使公共 NTP 看起来"层级更高", 也优先跟车机 ——
# 我们要的是三台机器**彼此一致**, 不是绝对时间最准。
# iburst: 开机时连发几个包快速收敛, 不然要等好几分钟。
server 192.168.1.10 iburst prefer minpoll 4 maxpoll 6

# --- 备用: 有外网时的公共源 ----------------------------------------------------
# 车机挂掉时不至于完全没有参考。注意它们的层级会低于车机的 prefer。
pool ntp.aliyun.com iburst maxsources 2

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony

# 本机不对外提供时间服务
port 0
cmdport 0
