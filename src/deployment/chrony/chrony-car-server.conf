# =============================================================================
# chrony-car-server.conf — 车机树莓派作为局域网 NTP 服务器
#
# 安装 (**仅车机 192.168.1.10**):
#   sudo install -m 0644 chrony-car-server.conf /etc/chrony/conf.d/air-ground.conf
#   sudo systemctl restart chrony
# 验证:
#   chronyc tracking          # 本机同步状态
#   chronyc clients           # 谁在向我同步
#
# -----------------------------------------------------------------------------
# 为什么是车机当服务器而不是实验室服务器
# -----------------------------------------------------------------------------
# (混元3 评审建议 2)
#
# 1. 车机是 MAVLink 汇集点。空地链路是
#      无人机 Pi →(3DR air)→(3DR ground)→ 车机 Pi → 服务器
#    时间基准放在数据流的汇聚处, 跨机时间戳对齐的误差链最短。
# 2. 车机在地面, GPS/PPS 信号比飞行中的无人机稳定得多。
# 3. 服务器可能根本不在现场 (场地无外网时), 让所有人依赖它反而更脆。
#
# 为什么时间同步对本项目是硬需求, 不是可选项:
# World Model 按时间戳做新鲜度过滤 (task-07)。两台 Pi 差 200ms 的话,
# 无人机刚上报的观测会被判为"过期"而丢弃 —— 现象是数据明明在发、
# 服务器侧就是看不到, 而且时好时坏。
# =============================================================================

# --- 上游时间源 --------------------------------------------------------------
# 有外网时用公共 NTP 校准。iburst 让开机同步更快。
pool ntp.aliyun.com iburst maxsources 3
pool cn.pool.ntp.org iburst maxsources 2

# GPS/PPS 参考源 (接了 GPS 模块后取消注释)。
# refclock 是本地硬件时钟源, 精度远高于网络 NTP, 且不依赖外网。
# refclock PPS /dev/pps0 lock NMEA refid PPS
# refclock SHM 0 offset 0.5 delay 0.2 refid NMEA

# --- 本地时基兜底 -------------------------------------------------------------
# 场地上大概率没有外网。local stratum 10 让本机在完全孤立时仍然对外提供
# 一个**自洽**的时间 —— 绝对时间可能是错的, 但三台机器彼此一致,
# 而新鲜度过滤只关心相对差值。
# 没有这一行的话, 断网时 chrony 会拒绝服务, 另外两台机器各走各的表。
local stratum 10 orphan

# --- 对外服务 ----------------------------------------------------------------
# 只对项目网段开放, 不做开放式 NTP 服务器
allow 192.168.1.0/24

# --- 本机行为 ----------------------------------------------------------------
driftfile /var/lib/chrony/chrony.drift
# 开机后若偏差超过 1 秒, 前 3 次允许直接跳变而不是缓慢 slew。
# 树莓派没有 RTC 电池, 每次上电时间都是错的, 靠 slew 要走很久才能对上。
makestep 1.0 3
rtcsync
logdir /var/log/chrony
