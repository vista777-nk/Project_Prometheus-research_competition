# =============================================================================
# docker-compose.car.yml — 车机角色覆盖
#
# 用法:
#   docker compose -f docker-compose.edge.yml -f docker-compose.car.yml up
#
# 只放**车机必然存在**的设备。可插拔的传感器见 docker-compose.car-sensors.yml。
# =============================================================================

services:
  edge-node:
    environment:
      AIR_GROUND_ROLE: car
      AIR_GROUND_CHASSIS: ${CHASSIS:-diff}

    devices:
      # 下位机串口 (STM32F407 麦轮 / MSPM0G3507 差速)。
      # 用 udev 符号链接 /dev/mcu 而不是 /dev/ttyAMA1: 换成 USB 转串口调试时
      # 设备名会变成 ttyUSB*, 符号链接让 compose 和 ROS 参数都不用改。
      # 规则见 network/99-air-ground-devices.rules。
      - /dev/mcu:/dev/mcu

      # I2C 总线 (ICM42688 IMU)。只要 config.txt 里 dtparam=i2c_arm=on,
      # 这个节点就常在, 与是否真接了 IMU 无关, 所以可以放在必需项里。
      - /dev/i2c-1:/dev/i2c-1
