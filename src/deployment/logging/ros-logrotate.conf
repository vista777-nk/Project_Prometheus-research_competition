# =============================================================================
# ros-logrotate.conf — ROS 日志轮转
#
# 安装:
#   sudo install -m 0644 ros-logrotate.conf /etc/logrotate.d/air-ground
# 验证 (不实际执行, 只看它打算做什么):
#   sudo logrotate -d /etc/logrotate.d/air-ground
#
# 为什么必须有: ROS 节点的 stdout 全量落盘, 一个 30Hz 的传感器节点开着
# output="screen" 时每天能写几百 MB。树莓派用的是 SD 卡 —— 写满之后
# 不只是日志停了, 整个系统会以各种奇怪的方式开始出错。
# =============================================================================

/var/log/air-ground/*.log
/var/log/air-ground/**/*.log
{
    daily
    rotate 7
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty

    # copytruncate 而不是 create:
    # ROS 节点会一直持有日志文件的 fd。直接 rename 的话节点会继续往
    # 那个已经改名的 inode 里写, 新文件永远是空的, 磁盘也不会被释放。
    # copytruncate 是先拷贝再把原文件截断为 0, fd 保持有效。
    # 代价: 拷贝和截断之间写入的那一点点日志会丢。对调试日志可以接受。
    copytruncate

    # 目录属主是容器内的 airground (uid 1000)
    su root root
}
